<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}Bay Family Mediation</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Absolute paths required here — markdown pages may be served from subdirectory URLs (e.g. /how-it-works/) -->
    <script>(s=>fetch('/header.html').then(r=>r.text()).then(h=>s.insertAdjacentHTML('beforebegin',h)))(document.currentScript)</script>

    <main{% if page.main_class %} class="{{ page.main_class }}"{% endif %}>
        {{ content }}
    </main>

    <script>(s=>fetch('/footer.html').then(r=>r.text()).then(h=>s.insertAdjacentHTML('beforebegin',h)))(document.currentScript)</script>
</body>
</html>
